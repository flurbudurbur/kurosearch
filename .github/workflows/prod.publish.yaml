name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  pull-requests: write

jobs:
  # Call the lint workflow and wait for it to complete
  lint:
    uses: ./.github/workflows/lint.yaml

  # Call the test workflow and wait for it to complete
  test:
    uses: ./.github/workflows/tests.yaml

  # Check for security vulnerabilities in dependencies
  dependency-security:
    uses: ./.github/workflows/dependency-security.yaml

  # Collect code coverage metrics
  coverage:
    uses: ./.github/workflows/coverage.yaml

  # Build and push Docker image only after all quality checks pass
  publish:
    needs: [lint, test, dependency-security, coverage]
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      docker-tags: |
        type=raw,value=latest
        type=raw,value={{version}}
        type=sha,prefix=sha-,format=short
    secrets:
      wt-url: ${{ secrets.WATCHTOWER_PROD_URL }}
      wt-token: ${{ secrets.WATCHTOWER_TOKEN }}
