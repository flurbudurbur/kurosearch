name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # Call the test workflow and wait for it to complete
  test:
    uses: ./.github/workflows/tests.yaml

  # Build and push Docker image only after all tests pass
  publish:
    needs: test
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      docker-tags: |
        type=raw,value=latest
        type=raw,value={{version}}
        type=sha,prefix=sha-,format=short
