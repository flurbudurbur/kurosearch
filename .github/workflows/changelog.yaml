name: Generate Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      since_tag:
        description: 'Generate changelog since this tag (leave empty for last tag)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag range
        id: tags
        run: |
          if [ -n "${{ inputs.since_tag }}" ]; then
            PREVIOUS_TAG="${{ inputs.since_tag }}"
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          fi

          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")

          echo "previous=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_TAG" >> $GITHUB_OUTPUT

          echo "Generating changelog from $PREVIOUS_TAG to $CURRENT_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG="${{ steps.tags.outputs.previous }}"
          CURRENT_TAG="${{ steps.tags.outputs.current }}"

          # Create or update CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          # Generate new section
          TEMP_FILE=$(mktemp)

          echo "## [$CURRENT_TAG] - $(date +%Y-%m-%d)" > "$TEMP_FILE"
          echo "" >> "$TEMP_FILE"

          # Get commits since last tag
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|||%h|||%an" --no-merges)
          else
            COMMITS=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"%s|||%h|||%an" --no-merges)
          fi

          # Parse conventional commits and categorize
          declare -A categories
          categories[feat]="### Features"
          categories[fix]="### Bug Fixes"
          categories[docs]="### Documentation"
          categories[style]="### Styling"
          categories[refactor]="### Refactoring"
          categories[perf]="### Performance"
          categories[test]="### Tests"
          categories[build]="### Build"
          categories[ci]="### CI/CD"
          categories[chore]="### Chores"

          # Group commits by type
          declare -A grouped
          while IFS='|||' read -r message hash author; do
            if [[ $message =~ ^([a-z]+)(\(.+\))?:\ (.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              scope="${BASH_REMATCH[2]}"
              description="${BASH_REMATCH[3]}"

              # Remove parentheses from scope
              scope="${scope#(}"
              scope="${scope%)}"

              if [ -n "$scope" ]; then
                formatted="- **$scope**: $description ([${hash}](https://github.com/${{ github.repository }}/commit/$hash))"
              else
                formatted="- $description ([${hash}](https://github.com/${{ github.repository }}/commit/$hash))"
              fi

              if [ -n "${categories[$type]}" ]; then
                grouped[$type]+="$formatted"$'\n'
              else
                grouped[other]+="$formatted"$'\n'
              fi
            else
              # Non-conventional commit
              grouped[other]+="- $message ([${hash}](https://github.com/${{ github.repository }}/commit/$hash))"$'\n'
            fi
          done <<< "$COMMITS"

          # Output categorized commits
          for type in feat fix perf refactor style test docs build ci chore; do
            if [ -n "${grouped[$type]}" ]; then
              echo "" >> "$TEMP_FILE"
              echo "${categories[$type]}" >> "$TEMP_FILE"
              echo "" >> "$TEMP_FILE"
              echo -n "${grouped[$type]}" >> "$TEMP_FILE"
            fi
          done

          # Other commits
          if [ -n "${grouped[other]}" ]; then
            echo "" >> "$TEMP_FILE"
            echo "### Other Changes" >> "$TEMP_FILE"
            echo "" >> "$TEMP_FILE"
            echo -n "${grouped[other]}" >> "$TEMP_FILE"
          fi

          echo "" >> "$TEMP_FILE"

          # Prepend new section to CHANGELOG.md (after header)
          {
            head -n 4 CHANGELOG.md
            cat "$TEMP_FILE"
            tail -n +5 CHANGELOG.md
          } > CHANGELOG.md.new

          mv CHANGELOG.md.new CHANGELOG.md
          rm "$TEMP_FILE"

          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to CHANGELOG.md"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "CHANGELOG.md has been updated"
          fi

      - name: Commit and push changelog
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ steps.tags.outputs.current }}"
          git push

      - name: Create summary
        if: steps.changelog.outputs.has_changes == 'true'
        run: |
          echo "## Changelog Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated changelog from **${{ steps.tags.outputs.previous }}** to **${{ steps.tags.outputs.current }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          head -n 50 CHANGELOG.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
