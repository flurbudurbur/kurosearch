name: Build Size Monitor

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  monitor-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract pnpm version from package.json
        id: pnpm-version
        run: |
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted pnpm version: $PNPM_VERSION"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the application
      - name: Build application (PR branch)
        run: pnpm run build

      - name: Analyze PR build size
        id: pr-size
        run: |
          # Get Vite bundle sizes
          BUILD_SIZE=$(du -sb build | cut -f1)
          BUILD_SIZE_MB=$(echo "scale=2; $BUILD_SIZE / 1024 / 1024" | bc)

          echo "size=$BUILD_SIZE" >> $GITHUB_OUTPUT
          echo "size_mb=$BUILD_SIZE_MB" >> $GITHUB_OUTPUT

          # Count and list largest files
          echo "## PR Build Analysis" > build-report.md
          echo "" >> build-report.md
          echo "**Total build size:** ${BUILD_SIZE_MB} MB" >> build-report.md
          echo "" >> build-report.md
          echo "### Largest files:" >> build-report.md
          echo "\`\`\`" >> build-report.md
          find build -type f -exec du -h {} + | sort -rh | head -20 >> build-report.md
          echo "\`\`\`" >> build-report.md

      - name: Save PR build artifacts
        run: mv build build-pr

      # Checkout base branch and build
      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

      - name: Install dependencies (base)
        run: pnpm install --frozen-lockfile

      - name: Build application (base branch)
        run: pnpm run build

      - name: Analyze base build size
        id: base-size
        run: |
          BUILD_SIZE=$(du -sb build | cut -f1)
          BUILD_SIZE_MB=$(echo "scale=2; $BUILD_SIZE / 1024 / 1024" | bc)

          echo "size=$BUILD_SIZE" >> $GITHUB_OUTPUT
          echo "size_mb=$BUILD_SIZE_MB" >> $GITHUB_OUTPUT

      # Compare sizes
      - name: Compare build sizes
        id: compare
        run: |
          PR_SIZE=${{ steps.pr-size.outputs.size }}
          BASE_SIZE=${{ steps.base-size.outputs.size }}

          DIFF=$((PR_SIZE - BASE_SIZE))
          DIFF_MB=$(echo "scale=2; $DIFF / 1024 / 1024" | bc)
          PERCENT=$(echo "scale=2; ($DIFF * 100) / $BASE_SIZE" | bc)

          echo "diff=$DIFF" >> $GITHUB_OUTPUT
          echo "diff_mb=$DIFF_MB" >> $GITHUB_OUTPUT
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT

          # Determine if size increased significantly
          if (( $(echo "$PERCENT > 10" | bc -l) )); then
            echo "significant=true" >> $GITHUB_OUTPUT
            echo "emoji=🔴" >> $GITHUB_OUTPUT
          elif (( $(echo "$PERCENT > 5" | bc -l) )); then
            echo "significant=false" >> $GITHUB_OUTPUT
            echo "emoji=🟡" >> $GITHUB_OUTPUT
          elif (( $(echo "$PERCENT < -5" | bc -l) )); then
            echo "significant=false" >> $GITHUB_OUTPUT
            echo "emoji=🟢" >> $GITHUB_OUTPUT
          else
            echo "significant=false" >> $GITHUB_OUTPUT
            echo "emoji=⚪" >> $GITHUB_OUTPUT
          fi

      - name: Create size comparison comment
        uses: actions/github-script@v7
        with:
          script: |
            const prSize = '${{ steps.pr-size.outputs.size_mb }}';
            const baseSize = '${{ steps.base-size.outputs.size_mb }}';
            const diffMb = '${{ steps.compare.outputs.diff_mb }}';
            const percent = '${{ steps.compare.outputs.percent }}';
            const emoji = '${{ steps.compare.outputs.emoji }}';
            const significant = '${{ steps.compare.outputs.significant }}' === 'true';

            const sign = parseFloat(diffMb) >= 0 ? '+' : '';

            let body = `## ${emoji} Build Size Report\n\n`;
            body += `| Metric | Base | PR | Change |\n`;
            body += `|--------|------|----|---------|\n`;
            body += `| **Bundle Size** | ${baseSize} MB | ${prSize} MB | ${sign}${diffMb} MB (${sign}${percent}%) |\n\n`;

            if (significant) {
              body += `### ⚠️ Warning\n\n`;
              body += `Build size increased by more than 10%. Please review:\n`;
              body += `- Are new dependencies necessary?\n`;
              body += `- Can assets be optimized?\n`;
              body += `- Are there unused imports?\n\n`;
            }

            body += `<details>\n<summary>View detailed breakdown</summary>\n\n`;
            body += require('fs').readFileSync('build-report.md', 'utf8');
            body += `\n</details>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Build Size Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Fail on significant size increase
        if: steps.compare.outputs.significant == 'true'
        run: |
          echo "::error::Build size increased by more than 10% (${{ steps.compare.outputs.percent }}%)"
          exit 1

      - name: Upload build comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-size-comparison
          path: |
            build-report.md
            build-pr/
          retention-days: 7
