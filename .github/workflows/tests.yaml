name: Test

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # Install dependencies once and cache for parallel jobs
  install:
    runs-on: ubuntu-latest
    outputs:
      pnpm-version: ${{ steps.pnpm-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract pnpm version from package.json
        id: pnpm-version
        run: |
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted pnpm version: $PNPM_VERSION"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache workspace
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            .pnpm-store
            ~/.cache/ms-playwright
          key: workspace-${{ github.sha }}

  # Run type checking and unit tests
  unit-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ needs.install.outputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .pnpm-store
            ~/.cache/ms-playwright
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run type check
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test:unit

  # Run integration tests in parallel with unit tests
  integration-tests:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ needs.install.outputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .pnpm-store
            ~/.cache/ms-playwright
          key: workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run integration tests
        env:
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          RULE34_API_KEY: ${{ secrets.RULE34_API_KEY }}
          RULE34_API_USER: ${{ secrets.RULE34_API_USER }}
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
