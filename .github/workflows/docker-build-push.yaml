name: Docker Build and Push

on:
  workflow_call:
    inputs:
      docker-tags:
        description: 'Docker tags configuration for docker/metadata-action'
        required: true
        type: string
    secrets:
      wt-url:
        description: 'Watchtower instance URL to trigger updates'
        required: true
      wt-token:
        description: 'Watchtower authentication token'
        required: true
    outputs:
      image-digest:
        description: 'Docker image digest'
        value: ${{ jobs.build-and-push.outputs.digest }}
      image-tags:
        description: 'Docker image tags'
        value: ${{ jobs.build-and-push.outputs.tags }}
      version:
        description: 'Package version'
        value: ${{ jobs.build-and-push.outputs.version }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.package-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Extract pnpm version from package.json
        id: pnpm-version
        run: |
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted pnpm version: $PNPM_VERSION"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.docker-tags }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FLUR34_VERSION=${{ steps.package-version.outputs.version }}
            PNPM_VERSION=${{ steps.pnpm-version.outputs.version }}
            GITHUB_SHA=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Trigger Watchtower auto-update
        if: success()
        continue-on-error: true
        env:
          WT_URL: ${{ secrets.wt-url }}
          WT_TOKEN: ${{ secrets.wt-token }}
        run: |
          if [ -n "$WT_URL" ] && [ -n "$WT_TOKEN" ]; then
            echo "Triggering Watchtower update..."
            curl -f -H "Authorization: Bearer $WT_TOKEN" \
              "$WT_URL" \
              && echo "Watchtower update triggered successfully" \
              || echo "Failed to trigger Watchtower update"
          else
            echo "Watchtower secrets not configured, skipping auto-update"
          fi
