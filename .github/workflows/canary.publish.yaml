name: Build and Publish Canary Docker Image

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  pull-requests: write

jobs:
  # Call the lint workflow and wait for it to complete
  lint:
    uses: ./.github/workflows/lint.yaml

  # Call the test workflow and wait for it to complete
  test:
    uses: ./.github/workflows/tests.yaml

  # Check for security vulnerabilities in dependencies
  dependency-security:
    uses: ./.github/workflows/dependency-security.yaml

  # Collect code coverage metrics
  coverage:
    uses: ./.github/workflows/coverage.yaml

  # Build and push canary Docker image only after all quality checks pass
  publish:
    needs: [lint, test, dependency-security, coverage]
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      docker-tags: |
        type=raw,value=canary
        type=raw,value=canary-{{version}}
    secrets:
      wt-url: ${{ secrets.WATCHTOWER_CANARY_URL }}
      wt-token: ${{ secrets.WATCHTOWER_TOKEN }}
