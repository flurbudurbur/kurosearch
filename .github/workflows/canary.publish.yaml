name: Build and Publish Canary Docker Image

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  pull-requests: write

jobs:
  # Run all quality checks in parallel
  quality-checks:
    strategy:
      fail-fast: false
      matrix:
        check:
          - workflow: ./.github/workflows/lint.yaml
            name: Lint
          - workflow: ./.github/workflows/tests.yaml
            name: Tests
          - workflow: ./.github/workflows/dependency-security.yaml
            name: Dependency Security
          - workflow: ./.github/workflows/coverage.yaml
            name: Coverage
    uses: ${{ matrix.check.workflow }}

  # Build and push canary Docker image only after all quality checks pass
  publish:
    needs: [quality-checks]
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      docker-tags: |
        type=raw,value=canary
        type=raw,value=canary-{{version}}
    secrets:
      wt-url: ${{ secrets.WATCHTOWER_CANARY_URL }}
      wt-token: ${{ secrets.WATCHTOWER_TOKEN }}
