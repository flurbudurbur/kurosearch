name: Build and Publish Canary Docker Image

on:
  pull_request:
    branches:
      - main

# Concurrency is handled by the called workflow (tests.yaml)
# to avoid deadlock when calling workflows

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  # Call the test workflow and wait for it to complete
  test:
    uses: ./.github/workflows/tests.yaml

  # Build and push canary Docker image only after all tests pass
  publish:
    needs: test
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      docker-tags: |
        type=raw,value=canary
        type=raw,value=canary-{{version}}
    secrets:
      wt-url: ${{ secrets.WATCHTOWER_CANARY_URL }}
      wt-token: ${{ secrets.WATCHTOWER_TOKEN }}
