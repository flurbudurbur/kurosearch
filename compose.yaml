name: 'kurosearch'

services:
  caddy:
    container_name: 'caddy'
    restart: unless-stopped
    image: 'caddy:2-alpine'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    cap_drop:
      - 'ALL'
    cap_add:
      - 'NET_BIND_SERVICE'
      # - 'NET_ADMIN'
      # Read before uncommenting. Security implications!
      # https://hub.docker.com/_/caddy#linux-capabilities
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./container/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/build:/srv:ro
    env_file:
      - '.env'
    networks:
      - 'kurosearch'
    logging:
      driver: 'json-file'
      options:
        max-size: '1m'
        max-file: '1'
    depends_on:
      - 'api'

  api:
    container_name: 'api'
    restart: unless-stopped
    build:
      context: api
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:3001:3001'
    env_file:
      - '.env'
    environment:
      - NODE_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=3001
      - VALKEY_HOST=valkey
    networks:
      - 'kurosearch'
    logging:
      driver: 'json-file'
      options:
        max-size: '1m'
        max-file: '1'
    depends_on:
      - 'valkey'

  valkey:
    container_name: 'valkey'
    restart: unless-stopped
    image: 'valkey/valkey:8-alpine'
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - valkey-data:/data
    networks:
      - 'kurosearch'
    logging:
      driver: 'json-file'
      options:
        max-size: '1m'
        max-file: '1'
    command: valkey-server --save 60 1 --loglevel warning

networks:
  kurosearch:

volumes:
  caddy-data:
  caddy-config:
  valkey-data:
